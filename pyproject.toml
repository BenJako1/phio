[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phio"
version = "0.1.0"
description = "A laser-induced photoionization simulation package"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]